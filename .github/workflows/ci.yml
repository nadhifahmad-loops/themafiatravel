name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mafia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/mafia_ci?schema=public
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/mafia_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:ci@localhost:5432/mafia_shadow?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      TICKET_VERIFY_SECRET: ci-ticket-secret-ci-ticket-secret-ci-ticket
      NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      # Membuktikan rantai migrasi bisa membangun database dari nol...
      - run: npx prisma migrate deploy
      # ...dan hasilnya sama persis dengan schema.prisma (gagal jika ada drift baru).
      - name: Cek drift schema vs migrasi
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -c 'CREATE DATABASE mafia_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image aplikasi
        run: docker build --target runner --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 -t mafia-travel:ci .
      - name: Build image migrator
        run: docker build --target migrator -t mafia-travel-migrate:ci .
